[package]
name = "compatlab-core"
version = "0.1.0"
edition = "2024"
description = "Core compatibility experiment engine for Python packages"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
